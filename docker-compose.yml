services:
  calendario:
    image: ghcr.io/fialhojeancarlos-stack/calendario-docker:latest
    container_name: calendario-entregas-jira
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production

      # Jira
      JIRA_BASE_URL: ${JIRA_BASE_URL}
      JIRA_EMAIL: ${JIRA_EMAIL}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN}
      JIRA_DUE_DATE_FIELD_ID: ${JIRA_DUE_DATE_FIELD_ID:-customfield_10224}
      JIRA_SPRINT_FIELD_ID: ${JIRA_SPRINT_FIELD_ID:-customfield_10020}
      JIRA_CLIENT_FIELD_ID: ${JIRA_CLIENT_FIELD_ID:-}

      # Supabase (backend / servidor)
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}

      # Supabase (front-end, injetado em runtime via /env.js)
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
      VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
      VITE_APP_VERSION: ${VITE_APP_VERSION:-1.0.0}
